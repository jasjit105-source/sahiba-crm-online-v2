[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── API ROUTES ─────────────────────────────────────────────────────────

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/checkin"
  to = "/.netlify/functions/checkin"
  status = 200

[[redirects]]
  from = "/api/import-log"
  to = "/.netlify/functions/import-log"
  status = 200

[[redirects]]
  from = "/api/query"
  to = "/.netlify/functions/query"
  status = 200

[[redirects]]
  from = "/api/sync-sales"
  to = "/.netlify/functions/sync-sales"
  status = 200

[[redirects]]
  from = "/api/sync-sales/*"
  to = "/.netlify/functions/sync-sales"
  status = 200

[[redirects]]
  from = "/api/customer-profile"
  to = "/.netlify/functions/customer-profile"
  status = 200

[[redirects]]
  from = "/api/customers-list"
  to = "/.netlify/functions/customers-list"
  status = 200

# ─── CACHE HEADERS ──────────────────────────────────────────────────────
# Force browsers to always re-fetch HTML and API responses.
# Without this, iOS Safari aggressively caches the dashboard and agents
# see stale data even after a fresh upload.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
