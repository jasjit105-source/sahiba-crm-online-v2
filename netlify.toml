[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/checkin"
  to = "/.netlify/functions/checkin"
  status = 200

[[redirects]]
  from = "/api/import-log"
  to = "/.netlify/functions/import-log"
  status = 200

[[redirects]]
  from = "/api/query"
  to = "/.netlify/functions/query"
  status = 200

[[redirects]]
  from = "/api/sync-sales"
  to = "/.netlify/functions/sync-sales"
  status = 200

[[redirects]]
  from = "/api/sync-sales/*"
  to = "/.netlify/functions/sync-sales"
  status = 200

[[redirects]]
  from = "/api/customer-profile"
  to = "/.netlify/functions/customer-profile"
  status = 200
